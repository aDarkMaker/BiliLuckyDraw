name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: luckydraw
    env:
      BUN_CONFIG_HTTP_IDLE_TIMEOUT: '30'
      BUN_CONFIG_HTTP_RETRY_COUNT: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: luckydraw/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: luckydraw/frontend
        shell: bash
        run: |
          unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
          bun install --frozen-lockfile

      - name: Install task & wails3
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.95
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build executable
        shell: bash
        run: |
          unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
          task windows:build

      - name: Package NSIS installer
        shell: bash
        run: |
          unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
          task windows:package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BiliLuckyDraw-windows
          path: |
            luckydraw/bin/luckydraw.exe
            luckydraw/bin/luckydraw-amd64-installer.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            luckydraw/bin/luckydraw.exe
            luckydraw/bin/luckydraw-amd64-installer.exe
