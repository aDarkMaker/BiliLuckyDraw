name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: luckydraw
    env:
      PACKAGE_MANAGER: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: luckydraw/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: luckydraw/frontend
        run: npm install

      - name: Install task & wails3
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.95
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) {
            $nsis = "${env:ProgramFiles}\NSIS"
          }
          echo $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$nsis\makensis.exe" /VERSION

      - name: Build executable
        run: task windows:build PACKAGE_MANAGER=npm

      - name: Package NSIS installer
        run: task windows:package PACKAGE_MANAGER=npm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BiliLuckyDraw-windows
          path: |
            luckydraw/bin/luckydraw.exe
            luckydraw/bin/luckydraw-amd64-installer.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            luckydraw/bin/luckydraw.exe
            luckydraw/bin/luckydraw-amd64-installer.exe
